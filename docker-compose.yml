services:
  postgres:
    image: postgres:16-alpine
    container_name: college-discovery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: college
      POSTGRES_PASSWORD: college
      POSTGRES_DB: college_discovery
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
